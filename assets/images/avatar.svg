<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#avatarBg)" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
  <circle cx="200" cy="200" r="175" fill="#0b1120"/>

  <!-- Code elements background -->
  <text x="60" y="110" fill="#38bdf8" opacity="0.3" font-family="monospace" font-size="16">&lt;dev&gt;</text>
  <text x="300" y="140" fill="#a855f7" opacity="0.3" font-family="monospace" font-size="16">{ts}</text>
  <text x="50" y="280" fill="#34d399" opacity="0.3" font-family="monospace" font-size="16">async</text>
  <text x="290" y="290" fill="#f43f5e" opacity="0.3" font-family="monospace" font-size="16">()=&gt;</text>

  <!-- Person/Developer Avatar -->
  <!-- Shoulders / Hoodie -->
  <path d="M 80,360 C 90,290 140,260 200,260 C 260,260 310,290 320,360 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2"/>
  <path d="M 160,262 L 200,320 L 240,262 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="175" y="210" width="50" height="55" rx="10" fill="#fbcfe8" opacity="0.9"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="#fcd34d" opacity="0.95"/>

  <!-- Modern Hair -->
  <path d="M 135,160 C 130,120 150,90 200,90 C 250,90 270,110 265,150 C 255,115 225,115 200,118 C 170,120 145,135 135,160 Z" fill="#1e1b4b"/>
  
  <!-- Glasses / VR Neon shades -->
  <rect x="148" y="155" width="46" height="26" rx="6" fill="#06b6d4" opacity="0.85"/>
  <rect x="206" y="155" width="46" height="26" rx="6" fill="#06b6d4" opacity="0.85"/>
  <line x1="194" y1="168" x2="206" y2="168" stroke="#0891b2" stroke-width="3"/>
  <!-- Glasses glow highlight -->
  <line x1="152" y1="160" x2="185" y2="160" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="210" y1="160" x2="243" y2="160" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <!-- Headphones -->
  <path d="M 130,175 C 130,120 160,95 200,95 C 240,95 270,120 270,175" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
  <rect x="122" y="155" width="16" height="40" rx="8" fill="#4f46e5"/>
  <rect x="262" y="155" width="16" height="40" rx="8" fill="#4f46e5"/>

  <!-- Smile -->
  <path d="M 185,215 Q 200,228 215,215" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
</svg>