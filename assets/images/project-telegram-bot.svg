<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#111c30" />
      <stop offset="100%" stop-color="#060a12" />
    </linearGradient>
    <linearGradient id="botBubble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad4)"/>
  <circle cx="200" cy="200" r="160" fill="#3b82f6" opacity="0.1" filter="blur(60px)"/>
  <circle cx="600" cy="300" r="150" fill="#10b981" opacity="0.1" filter="blur(60px)"/>

  <!-- Telegram Desktop / Chat Interface Mockup -->
  <g transform="translate(120, 40)">
    <rect width="560" height="420" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Chat Header -->
    <rect x="0" y="0" width="560" height="60" rx="16" fill="#1e293b"/>
    <rect x="0" y="30" width="560" height="30" fill="#1e293b"/>
    <circle cx="40" cy="30" r="18" fill="#10b981"/>
    <text x="32" y="36" fill="#ffffff" font-family="sans-serif" font-size="16">🤖</text>
    <text x="70" y="27" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">SmartAssistant AI Bot</text>
    <text x="70" y="44" fill="#34d399" font-family="sans-serif" font-size="11">bot • @smart_assistant_ai_bot</text>
    
    <!-- Verified Badge -->
    <circle cx="232" cy="23" r="7" fill="#38bdf8"/>
    <text x="229" y="27" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">✓</text>

    <!-- Chat Messages Area -->
    <!-- User Message 1 -->
    <g transform="translate(180, 80)">
      <rect width="350" height="48" rx="12" fill="url(#userBubble)"/>
      <text x="14" y="22" fill="#ffffff" font-family="sans-serif" font-size="12">Menga bu haftalik savdo hisobotini tahlil qilib,</text>
      <text x="14" y="38" fill="#ffffff" font-family="sans-serif" font-size="12">PDF xulosa tayyorlab ber.</text>
      <text x="315" y="40" fill="#cbd5e1" font-family="sans-serif" font-size="9">14:22</text>
    </g>

    <!-- Bot Response 1 -->
    <g transform="translate(25, 140)">
      <rect width="400" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">📊 Savdo hisoboti qabul qilindi va tahlil qilindi:</text>
      <text x="14" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Jami tushum: 84,200,000 UZS (+14%)</text>
      <text x="14" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Eng ko'p sotilgan tovar: "Premium Smartwatch"</text>
      <text x="14" y="80" fill="#a7f3d0" font-family="sans-serif" font-size="11">📄 PDF hisobot generatsiya qilindi: hisobot_23_nov.pdf</text>
      <text x="365" y="86" fill="#94a3b8" font-family="sans-serif" font-size="9">14:22</text>
    </g>

    <!-- Inline Keyboards / Buttons -->
    <g transform="translate(25, 245)">
      <rect x="0" y="0" width="125" height="34" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="18" y="21" fill="#f8fafc" font-family="sans-serif" font-size="11">📥 PDF yuklab olish</text>

      <rect x="135" y="0" width="125" height="34" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="155" y="21" fill="#f8fafc" font-family="sans-serif" font-size="11">📈 Excel eksport</text>

      <rect x="270" y="0" width="130" height="34" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="288" y="21" fill="#f8fafc" font-family="sans-serif" font-size="11">🔄 Qayta hisoblash</text>
    </g>

    <!-- User Message 2 -->
    <g transform="translate(240, 295)">
      <rect width="290" height="40" rx="12" fill="url(#userBubble)"/>
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="12">Telegram guruhga ham avtomatik yuborilsinmi?</text>
      <text x="255" y="32" fill="#cbd5e1" font-family="sans-serif" font-size="9">14:23</text>
    </g>

    <!-- Input Bar -->
    <g transform="translate(15, 360)">
      <rect width="530" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="22" y="28" fill="#64748b" font-family="sans-serif" font-size="13">Xabaringizni yozing...</text>
      <circle cx="495" cy="23" r="16" fill="#38bdf8"/>
      <path d="M 490,28 L 502,23 L 490,18 L 493,22 L 498,23 L 493,24 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>