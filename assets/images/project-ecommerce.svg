<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad2)"/>
  <circle cx="200" cy="150" r="150" fill="#8b5cf6" opacity="0.12" filter="blur(70px)"/>
  <circle cx="600" cy="350" r="180" fill="#ec4899" opacity="0.1" filter="blur(70px)"/>

  <!-- E-Commerce Browser Mockup -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0,14 C 0,6.268 6.268,0 14,0 L 666,0 C 673.732,0 680,6.268 680,14 L 680,44 L 0,44 Z" fill="#1e293b"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="22" r="5" fill="#10b981"/>
    
    <rect x="90" y="11" width="300" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="105" y="26" fill="#94a3b8" font-family="monospace" font-size="10">https://novastore.uz/shop</text>

    <!-- Nav Bar -->
    <rect x="0" y="44" width="680" height="40" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="69" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">NOVA<tspan fill="#ec4899">STORE</tspan></text>
    <rect x="180" y="58" width="60" height="12" rx="3" fill="#334155"/>
    <rect x="260" y="58" width="60" height="12" rx="3" fill="#334155"/>
    <rect x="340" y="58" width="60" height="12" rx="3" fill="#334155"/>
    <!-- Cart badge -->
    <rect x="600" y="54" width="50" height="20" rx="6" fill="url(#purplePink)"/>
    <text x="614" y="68" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Savat (3)</text>

    <!-- Hero Banner inside page -->
    <rect x="30" y="100" width="620" height="110" rx="10" fill="linear-gradient(135deg, #1e1b4b 0%, #312e81 100%)" stroke="#4338ca" stroke-width="1"/>
    <text x="55" y="140" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Yangi Avlod Smart Gadjetlari</text>
    <text x="55" y="165" fill="#c7d2fe" font-family="sans-serif" font-size="11">Eng so'nggi texnologiyalar kafolatlangan narxlarda</text>
    <rect x="55" y="178" width="90" height="22" rx="5" fill="#f43f5e"/>
    <text x="70" y="193" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Xarid qilish →</text>

    <!-- Product Cards Grid -->
    <g transform="translate(30, 225)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="140" height="165" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="10" width="120" height="80" rx="6" fill="#0f172a"/>
      <circle cx="70" cy="50" r="24" fill="#6366f1" opacity="0.4"/>
      <text x="12" y="110" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Wireless Headset</text>
      <text x="12" y="130" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="bold">$129.99</text>
      <rect x="12" y="140" width="116" height="16" rx="4" fill="#3b82f6"/>
      <text x="44" y="152" fill="#ffffff" font-family="sans-serif" font-size="8">Savatga qo'shish</text>

      <!-- Card 2 -->
      <rect x="160" y="0" width="140" height="165" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="170" y="10" width="120" height="80" rx="6" fill="#0f172a"/>
      <circle cx="230" cy="50" r="24" fill="#ec4899" opacity="0.4"/>
      <text x="172" y="110" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Smart Watch Ultra</text>
      <text x="172" y="130" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="bold">$249.00</text>
      <rect x="172" y="140" width="116" height="16" rx="4" fill="#3b82f6"/>
      <text x="204" y="152" fill="#ffffff" font-family="sans-serif" font-size="8">Savatga qo'shish</text>

      <!-- Card 3 -->
      <rect x="320" y="0" width="140" height="165" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="330" y="10" width="120" height="80" rx="6" fill="#0f172a"/>
      <circle cx="390" cy="50" r="24" fill="#10b981" opacity="0.4"/>
      <text x="332" y="110" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Pro Camera 4K</text>
      <text x="332" y="130" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="bold">$799.00</text>
      <rect x="332" y="140" width="116" height="16" rx="4" fill="#3b82f6"/>
      <text x="364" y="152" fill="#ffffff" font-family="sans-serif" font-size="8">Savatga qo'shish</text>

      <!-- Card 4 -->
      <rect x="480" y="0" width="140" height="165" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="490" y="10" width="120" height="80" rx="6" fill="#0f172a"/>
      <circle cx="550" cy="50" r="24" fill="#f59e0b" opacity="0.4"/>
      <text x="492" y="110" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Mechanical Keyb</text>
      <text x="492" y="130" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="bold">$89.50</text>
      <rect x="492" y="140" width="116" height="16" rx="4" fill="#3b82f6"/>
      <text x="524" y="152" fill="#ffffff" font-family="sans-serif" font-size="8">Savatga qo'shish</text>
    </g>
  </g>
</svg>