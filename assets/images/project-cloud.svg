<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cloudBg)"/>
  <circle cx="200" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="blur(60px)"/>
  <circle cx="620" cy="320" r="150" fill="#818cf8" opacity="0.12" filter="blur(60px)"/>

  <!-- Architecture Console Window Mockup -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#090e17" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 0,14 C 0,6.268 6.268,0 14,0 L 666,0 C 673.732,0 680,6.268 680,14 L 680,44 L 0,44 Z" fill="#151e2e"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="22" r="5" fill="#10b981"/>
    <text x="85" y="27" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">cluster-monitor // kubernetes-mesh.production</text>
    
    <!-- Metrics Grid -->
    <g transform="translate(30, 65)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="190" height="80" rx="10" fill="#111a2e" stroke="#1e2d4a" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Nodes</text>
      <text x="20" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold">32 Pods</text>

      <!-- Metric 2 -->
      <rect x="215" y="0" width="190" height="80" rx="10" fill="#111a2e" stroke="#1e2d4a" stroke-width="1"/>
      <text x="235" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">Throughput RPS</text>
      <text x="235" y="60" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold">48.2k req/s</text>

      <!-- Metric 3 -->
      <rect x="430" y="0" width="190" height="80" rx="10" fill="#111a2e" stroke="#1e2d4a" stroke-width="1"/>
      <text x="450" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">Latency p99</text>
      <text x="450" y="60" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold">4.2 ms</text>
    </g>

    <!-- Visual Architecture Diagram Area -->
    <g transform="translate(30, 165)">
      <rect width="620" height="210" rx="10" fill="#0f172a" stroke="#1e2d4a" stroke-width="1"/>
      
      <!-- API Gateway -->
      <rect x="30" y="70" width="110" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="45" y="100" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">API Gateway</text>
      <text x="48" y="122" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Kong / Envoy</text>

      <!-- Lines -->
      <line x1="140" y1="105" x2="200" y2="60" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="1.5"/>
      <line x1="140" y1="105" x2="200" y2="105" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="1.5"/>
      <line x1="140" y1="105" x2="200" y2="150" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="1.5"/>

      <!-- Service 1 -->
      <rect x="200" y="30" width="120" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="215" y="55" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">Auth Service</text>
      <text x="215" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">JWT / OAuth2</text>

      <!-- Service 2 -->
      <rect x="200" y="85" width="120" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="215" y="110" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">Core Engine</text>
      <text x="215" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Go / gRPC</text>

      <!-- Service 3 -->
      <rect x="200" y="140" width="120" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="215" y="165" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">Queue Worker</text>
      <text x="215" y="180" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Kafka / Celery</text>

      <!-- Database & Cache -->
      <line x1="320" y1="110" x2="380" y2="85" stroke="#10b981" stroke-width="1.5"/>
      <line x1="320" y1="110" x2="380" y2="135" stroke="#f59e0b" stroke-width="1.5"/>

      <rect x="380" y="60" width="100" height="45" rx="8" fill="#13241b" stroke="#10b981" stroke-width="1"/>
      <text x="395" y="85" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">Redis Cache</text>
      
      <rect x="380" y="115" width="100" height="45" rx="8" fill="#241e13" stroke="#f59e0b" stroke-width="1"/>
      <text x="395" y="140" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold">PostgreSQL</text>

      <!-- Telemetry Box -->
      <rect x="500" y="30" width="100" height="150" rx="8" fill="#171e2e" stroke="#3b82f6" stroke-width="1"/>
      <text x="512" y="55" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="bold">Observability</text>
      <text x="512" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Prometheus</text>
      <text x="512" y="105" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Grafana</text>
      <text x="512" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• OpenTelemetry</text>
      <text x="512" y="155" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">● Healthy</text>
    </g>
  </g>
</svg>
