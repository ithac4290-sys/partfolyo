<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE" />
      <stop offset="100%" stop-color="#229ED9" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad3)"/>
  <circle cx="400" cy="250" r="200" fill="#229ED9" opacity="0.1" filter="blur(80px)"/>

  <!-- Telegram App Window Mockup -->
  <g transform="translate(180, 25)">
    <!-- Phone frame for Mini App -->
    <rect width="440" height="450" rx="36" fill="#17212b" stroke="#242f3d" stroke-width="4"/>
    
    <!-- Telegram Header -->
    <rect x="0" y="0" width="440" height="65" rx="36" fill="#242f3d"/>
    <rect x="0" y="30" width="440" height="35" fill="#242f3d"/>
    
    <!-- TMA Top Bar -->
    <text x="30" y="42" fill="#64b5f6" font-family="sans-serif" font-size="13" font-weight="600">Yopish</text>
    <text x="140" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">FastFood Express TMA</text>
    <circle cx="400" cy="38" r="3" fill="#ffffff"/>
    <circle cx="408" cy="38" r="3" fill="#ffffff"/>
    <circle cx="416" cy="38" r="3" fill="#ffffff"/>

    <!-- App Inner Area -->
    <g transform="translate(20, 75)">
      <!-- Search & Address -->
      <rect x="0" y="0" width="400" height="36" rx="10" fill="#0e1621" stroke="#2b3b4f" stroke-width="1"/>
      <text x="15" y="23" fill="#798b9c" font-family="sans-serif" font-size="12">📍 Toshkent, Chilonzor 9-kvartal</text>

      <!-- Categories Pills -->
      <rect x="0" y="48" width="80" height="28" rx="14" fill="#2AABEE"/>
      <text x="15" y="66" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">🍔 Burgerlar</text>
      
      <rect x="90" y="48" width="75" height="28" rx="14" fill="#242f3d"/>
      <text x="105" y="66" fill="#9ab0c5" font-family="sans-serif" font-size="11">🍕 Pitsa</text>

      <rect x="175" y="48" width="75" height="28" rx="14" fill="#242f3d"/>
      <text x="190" y="66" fill="#9ab0c5" font-family="sans-serif" font-size="11">🍟 Gazaklar</text>

      <rect x="260" y="48" width="85" height="28" rx="14" fill="#242f3d"/>
      <text x="275" y="66" fill="#9ab0c5" font-family="sans-serif" font-size="11">🥤 Ichimliklar</text>

      <!-- Food Item 1 -->
      <rect x="0" y="90" width="400" height="75" rx="12" fill="#242f3d" stroke="#2b3b4f" stroke-width="1"/>
      <rect x="12" y="10" width="55" height="55" rx="8" fill="#f59e0b" opacity="0.2"/>
      <text x="25" y="45" font-size="28">🍔</text>
      <text x="80" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Double Cheese Burger</text>
      <text x="80" y="50" fill="#798b9c" font-family="sans-serif" font-size="11">Mol go'shti, cheddar, maxsus sous</text>
      <text x="80" y="68" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">45,000 so'm</text>
      <!-- Add Button -->
      <rect x="320" y="35" width="65" height="28" rx="8" fill="#2AABEE"/>
      <text x="335" y="53" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">+ Qo'shish</text>

      <!-- Food Item 2 -->
      <rect x="0" y="175" width="400" height="75" rx="12" fill="#242f3d" stroke="#2b3b4f" stroke-width="1"/>
      <rect x="12" y="10" width="55" height="55" rx="8" fill="#ef4444" opacity="0.2"/>
      <text x="25" y="45" font-size="28">🍕</text>
      <text x="80" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Pepperoni Max Pizza (32cm)</text>
      <text x="80" y="50" fill="#798b9c" font-family="sans-serif" font-size="11">Italyancha kolbasa, motsarella</text>
      <text x="80" y="68" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">78,000 so'm</text>
      <!-- Add Button -->
      <rect x="320" y="35" width="65" height="28" rx="8" fill="#2AABEE"/>
      <text x="335" y="53" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">+ Qo'shish</text>

      <!-- Main Action Floating Button -->
      <rect x="0" y="275" width="400" height="48" rx="12" fill="#2AABEE"/>
      <text x="110" y="305" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Buyurtmani rasmiylashtirish (2)</text>
      <text x="330" y="305" fill="#e0f2fe" font-family="sans-serif" font-size="13">123,000 UZS</text>
    </g>
  </g>
</svg>