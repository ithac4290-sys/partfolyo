<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a" />
      <stop offset="50%" stop-color="#161226" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad6)"/>
  <circle cx="400" cy="250" r="180" fill="#8b5cf6" opacity="0.12" filter="blur(70px)"/>

  <!-- Mobile Phone Mockup -->
  <g transform="translate(260, 20)">
    <rect width="280" height="460" rx="36" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <rect x="5" y="5" width="270" height="450" rx="32" fill="#0f172a"/>

    <rect x="95" y="14" width="90" height="20" rx="10" fill="#000000"/>
    <circle cx="168" cy="24" r="4.5" fill="#1e293b"/>

    <!-- App Header -->
    <g transform="translate(20, 48)">
      <text x="0" y="18" fill="#94a3b8" font-family="sans-serif" font-size="11">Asosiy Hamyon</text>
      <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">FinWallet UI</text>
      <!-- Bell Icon -->
      <circle cx="225" cy="26" r="16" fill="#1e293b"/>
      <text x="219" y="31" fill="#cbd5e1" font-size="13">🔔</text>
    </g>

    <!-- Virtual Credit Card -->
    <g transform="translate(20, 100)">
      <rect width="240" height="135" rx="16" fill="url(#cardGrad)" filter="drop-shadow(0 10px 15px rgba(99,102,241,0.3))"/>
      <circle cx="205" cy="35" r="15" fill="#ffffff" opacity="0.3"/>
      <circle cx="218" cy="35" r="15" fill="#ffffff" opacity="0.3"/>
      <text x="18" y="34" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">BLACK CARD</text>
      
      <text x="18" y="70" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="10">Balans</text>
      <text x="18" y="92" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">34,850,000 <tspan font-size="12">UZS</tspan></text>
      <text x="18" y="118" fill="#ffffff" opacity="0.9" font-family="monospace" font-size="11">•••• 8842</text>
      <text x="195" y="118" fill="#ffffff" opacity="0.9" font-family="monospace" font-size="11">09/28</text>
    </g>

    <!-- Quick Action Buttons -->
    <g transform="translate(20, 250)">
      <!-- Send -->
      <circle cx="30" cy="20" r="18" fill="#1e293b"/>
      <text x="23" y="25" fill="#a855f7" font-size="14">↗</text>
      <text x="12" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="10">O'tkazish</text>

      <!-- Receive -->
      <circle cx="90" cy="20" r="18" fill="#1e293b"/>
      <text x="83" y="25" fill="#10b981" font-size="14">↙</text>
      <text x="73" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="10">Qabul qilish</text>

      <!-- Pay -->
      <circle cx="150" cy="20" r="18" fill="#1e293b"/>
      <text x="143" y="25" fill="#38bdf8" font-size="14">⚡</text>
      <text x="137" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="10">To'lovlar</text>

      <!-- More -->
      <circle cx="210" cy="20" r="18" fill="#1e293b"/>
      <text x="203" y="25" fill="#f59e0b" font-size="14">•••</text>
      <text x="198" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="10">Ko'proq</text>
    </g>

    <!-- Recent Transactions -->
    <g transform="translate(20, 320)">
      <text x="0" y="10" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">So'nggi amaliyotlar</text>

      <rect x="0" y="20" width="240" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="45" r="14" fill="#3b82f6" opacity="0.2"/>
      <text x="19" y="50" fill="#60a5fa" font-size="13">💻</text>
      <text x="50" y="38" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Hosting & Domen</text>
      <text x="50" y="52" fill="#94a3b8" font-family="sans-serif" font-size="9">Bugun, 11:20</text>
      <text x="165" y="44" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold">- 450,000</text>

      <rect x="0" y="78" width="240" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="99" r="14" fill="#10b981" opacity="0.2"/>
      <text x="19" y="104" fill="#34d399" font-size="13">💰</text>
      <text x="50" y="94" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Frilans to'lovi</text>
      <text x="50" y="107" fill="#94a3b8" font-family="sans-serif" font-size="9">Kecha, 19:40</text>
      <text x="155" y="101" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">+ 5,200,000</text>
    </g>
  </g>
</svg>